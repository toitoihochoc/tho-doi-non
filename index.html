<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Thỏ Đội Nón AR</title>
<style>
  :root { --ink:#2b2326; --paper:#fdf6ec; --accent:#e9c58c; }
  html,body { margin:0; height:100%; overflow:hidden; background:#000; font-family:system-ui,"Segoe UI",sans-serif; color:var(--ink); }
  #ar { position:fixed; inset:0; }
  #intro { position:fixed; inset:0; z-index:10; background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px 16px; box-sizing:border-box; text-align:center; }
  #intro img { width:min(46vw,220px); border:2px solid var(--ink); border-radius:12px; transform:rotate(-3deg); background:#fff; }
  #intro h1 { margin:0; font-size:24px; }
  #intro p { margin:0; max-width:340px; line-height:1.5; font-size:15px; }
  button { border:2px solid var(--ink); background:var(--accent); color:var(--ink); border-radius:999px; padding:12px 28px; font-size:17px; font-weight:700; cursor:pointer; }
  .link { font-size:13px; color:var(--ink); opacity:.7; }
  #hint { position:fixed; left:0; right:0; bottom:24px; z-index:5; text-align:center; pointer-events:none; }
  #hint span { background:#fffffff0; border:2px solid var(--ink); border-radius:999px; padding:8px 16px; font-size:14px; font-weight:600; }
  #err { color:#b3261e; font-size:14px; max-width:340px; }
</style>
</head>
<body>
<div id="ar"></div>
<div id="intro">
  <img src="target.jpg" alt="Hình vẽ chú thỏ đội nón">
  <h1>Thỏ Đội Nón 🐰🎩</h1>
  <p>Hướng camera vào hình vẽ chú thỏ trên trang giấy. Giữ yên một chút, chú thỏ sẽ nhảy ra khỏi trang! Nên quét ở nơi đủ sáng, để trang giấy nằm trên bàn.</p>
  <button id="start">📷 Bắt đầu quét</button>
  <a class="link" href="?demo">Không có trang giấy? Xem thử không cần camera</a>
  <a class="link" href="viewer.html">Xem mô hình 3D xoay tự do</a>
  <div id="err"></div>
</div>
<div id="hint" hidden><span id="hintText">Đưa camera vào hình vẽ…</span></div>

<script src="model.js?v=13"></script>
<script src="tracker.js?v=2"></script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
} }
</script>
<script type="module">
import * as THREE from 'three';

// Tỉ lệ hình nhận diện (target.jpg 615 x 790): MindAR coi chiều rộng = 1
const TARGET_H = 790 / 615;
const FEET_Y = -0.42;      // vị trí chân chú thỏ trên hình vẽ
const LAND_Y = -0.12;      // chỗ chú thỏ đáp xuống sau khi nhảy
const SCALE = 0.36;

const intro = document.getElementById('intro');
const hint = document.getElementById('hint');
const hintText = document.getElementById('hintText');
const isDemo = new URLSearchParams(location.search).has('demo');

// ---------- chú thỏ + hiệu ứng nhảy ----------
function makeActor() {
  const B = window.buildBunny(THREE);
  B.root.scale.setScalar(SCALE);
  const actor = new THREE.Group();          // gốc tại chân, nằm trên mặt giấy
  actor.add(B.root);

  // bóng mờ dưới chân
  const shadow = new THREE.Mesh(
    new THREE.CircleGeometry(0.2, 40),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25, depthWrite: false })
  );
  shadow.scale.set(1, 0.55, 1);
  shadow.position.z = 0.002;

  const root = new THREE.Group();
  root.add(shadow, actor);

  let state = 'hidden', t0 = 0, nextHop = 0;
  const ease = (x) => 1 - Math.pow(1 - x, 3);

  function reset() {
    state = 'hidden';
    root.visible = false;
  }
  function jump(now) {
    state = 'jump'; t0 = now; root.visible = true;
  }
  function hop(now) {
    if (state === 'idle') { state = 'hop'; t0 = now; }
  }

  function update(now) {
    if (state === 'hidden') return;
    B.update(now);
    const t = now - t0;
    let rot = Math.PI / 2, y = LAND_Y, z = 0, sx = 1, sy = 1, appear = 1;

    if (state === 'jump') {
      const D = 1.15;
      const p = Math.min(t / D, 1);
      appear = Math.min(t / 0.25, 1);
      rot = (Math.PI / 2) * ease(Math.min(p * 1.25, 1));   // từ nằm trên giấy → đứng dậy
      y = FEET_Y + (LAND_Y - FEET_Y) * ease(p);
      z = Math.sin(Math.PI * p) * 0.45;                    // vòng cung nhảy lên
      if (p < 0.15) { sy = 1 - p * 1.5; sx = 1 + p; }      // nhún lấy đà
      if (p >= 1) { state = 'land'; t0 = now; B.greet(now + 0.3); }
    } else if (state === 'land' || state === 'hop') {
      const D = state === 'land' ? 0.5 : 0.7;
      const p = Math.min(t / D, 1);
      if (state === 'hop') z = Math.sin(Math.PI * p) * 0.18;
      const squash = Math.sin(Math.PI * Math.min(p * (state === 'hop' ? 1 : 1.6), 1)) * (state === 'hop' ? 0.08 : 0.18);
      if (state === 'land' || p > 0.8) { sy = 1 - squash; sx = 1 + squash * 0.6; }
      if (p >= 1) { state = 'idle'; t0 = now; nextHop = now + 3 + Math.random() * 3; }
    } else if (state === 'idle') {
      sy = 1 + Math.sin(t * 3) * 0.015;
      B.headPivot.rotation.z = Math.sin(t * 1.3) * 0.08;
      B.ears[0].rotation.z = -0.85 + Math.sin(t * 2.4) * 0.07;
      B.ears[1].rotation.z = 0.85 + Math.sin(t * 2.4 + 1) * 0.07;
      B.arms[0].rotation.z = -0.35 - Math.max(0, Math.sin(t * 2)) * 0.25;
      if (now > nextHop) hop(now);
    }

    actor.position.set(0, y, z);
    actor.rotation.x = rot;
    actor.scale.set(sx * appear, sy * appear, sx * appear);
    shadow.position.y = y + 0.02;
    const s = Math.max(0.35, 1 - z * 1.4) * appear;
    shadow.scale.set(s, 0.55 * s, 1);
    shadow.material.opacity = 0.25 * s;
  }

  reset();
  return { root, update, jump, hop, reset, get state() { return state; } };
}

function addLights(scene) {
  // ánh sáng mềm kiểu studio cho chất liệu nhung (trục lên trong AR là +Z)
  const hemi = new THREE.HemisphereLight(0xe6f0ff, 0xfff0d6, 1.7);
  hemi.position.set(0, 0, 1);
  scene.add(hemi);
  const key = new THREE.DirectionalLight(0xfff6ea, 1.8);
  key.position.set(0.8, -1.2, 2.2);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xdfe9ff, 0.9);
  rim.position.set(-1, 1.5, 1.2);
  scene.add(rim);
}

const clock = new THREE.Clock();

// ---------- con quay hồi chuyển: giữ góc nhìn khi tạm mất dấu hình vẽ ----------
const gyro = { q: new THREE.Quaternion(), ok: false, hist: [] };
// hướng điện thoại tại thời điểm t (giây, performance.now) — dùng để khớp với khung hình camera vốn bị trễ
function gyroAt(t, out) {
  const h = gyro.hist;
  if (!h.length) return out.copy(gyro.q);
  for (let i = h.length - 1; i > 0; i--) {
    if (h[i - 1].t <= t) {
      const a = h[i - 1], b = h[i], k = Math.min(1, Math.max(0, (t - a.t) / Math.max(1e-4, b.t - a.t)));
      return out.copy(a.q).slerp(b.q, k);
    }
  }
  return out.copy(h[0].q);
}
function listenGyro() {
  const zee = new THREE.Vector3(0, 0, 1), eul = new THREE.Euler(), qS = new THREE.Quaternion();
  const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5));
  const D = THREE.MathUtils.DEG2RAD;
  addEventListener("deviceorientation", (e) => {
    if (e.alpha == null) return;
    const orient = ((screen.orientation && screen.orientation.angle) || window.orientation || 0) * D;
    eul.set(e.beta * D, e.alpha * D, -e.gamma * D, "YXZ");
    gyro.q.setFromEuler(eul).multiply(q1).multiply(qS.setFromAxisAngle(zee, -orient));
    gyro.ok = true;
    gyro.hist.push({ t: performance.now() / 1000, q: gyro.q.clone() });
    if (gyro.hist.length > 60) gyro.hist.shift();
  });
}
// iOS bắt buộc xin quyền ngay trong lúc bấm nút
function askGyroPermission() {
  try {
    if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
      return DeviceOrientationEvent.requestPermission().then((r) => r === "granted").catch(() => false);
    }
  } catch (e) {}
  return Promise.resolve(true);
}

// ---------- chế độ AR thật ----------
const REJUMP_AFTER = 8; // mất dấu lâu hơn 8 giây thì lần sau thỏ nhảy ra lại từ đầu
async function startAR() {
  const { MindARThree } = await import("mindar-image-three");
  const mindar = new MindARThree({
    container: document.getElementById("ar"),
    imageTargetSrc: "./targets.mind",
    uiScanning: "no",
    uiLoading: "yes",
    filterMinCF: 0.001,
    filterBeta: 10,
    missTolerance: 4,
    warmupTolerance: 2,
  });
  const { renderer, scene, camera } = mindar;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  addLights(scene);
  const anchor = mindar.addAnchor(0);
  const actor = makeActor();

  const holder = new THREE.Group();
  holder.matrixAutoUpdate = false;
  holder.visible = false;
  holder.add(actor.root);
  scene.add(holder);

  // ----- bộ ổn định vị trí -----
  // Trang giấy đứng yên trong phòng. Ta lưu vị trí thỏ trong "hệ phòng" (camera đã bỏ phần xoay nhờ con quay):
  //  • xoay điện thoại → con quay bù ngay lập tức, không trễ
  //  • phép đo của camera (nhiễu) → qua bộ lọc One Euro: đứng yên thì lọc rất mạnh, di chuyển thì bám nhanh
  //  • bỏ phép đo hỏng (méo, nhảy vọt); hỏng liên tục thì ẩn thỏ
  //  • ma trận cứng, tỉ lệ đều → không bị dẹt; hướng "lên" theo trọng lực → luôn đứng thẳng
  const CAM_LAG = 0.07; // độ trễ ước tính của khung hình camera so với con quay (giây)
  const wPos = new THREE.Vector3(), wQuat = new THREE.Quaternion();
  let sScale = 1, have = false, rejects = 0, lastMeasT = 0;
  const mPos = new THREE.Vector3(), mQuat = new THREE.Quaternion(), mScl = new THREE.Vector3();
  const cPos = new THREE.Vector3(), cQuat = new THREE.Quaternion();
  let cScale = 1, cand = false;
  const qM = new THREE.Quaternion(), qR = new THREE.Quaternion(), qRi = new THREE.Quaternion(), one = new THREE.Vector3();
  const sPos = new THREE.Vector3(), sQuat = new THREE.Quaternion(); // tư thế trong khung camera để vẽ
  const nowS = () => performance.now() / 1000;
  const camQAt = (t, out) => (gyro.ok ? gyroAt(t, out) : out.identity());

  // bộ lọc thích ứng cho vị trí, tách thành HƯỚNG nhìn (thỏ ở đâu trên màn hình) và KHOẢNG CÁCH (thỏ to/nhỏ).
  // Nhiễu của camera chủ yếu nằm ở khoảng cách → lọc khoảng cách mạnh hơn, hướng thì vừa phải.
  const wDir = new THREE.Vector3(0, 0, -1), rDir = new THREE.Vector3();
  let wLogD = 0, angVel = 0, logVel = 0;
  const lowpass = (cut, dt) => 1 / (1 + 1 / (2 * Math.PI * cut * dt));
  function resetPos(raw) {
    wLogD = Math.log(raw.length()); wDir.copy(raw).normalize(); angVel = 0; logVel = 0;
    wPos.copy(raw);
  }
  function filterPos(raw, dt) {
    const d = raw.length();
    rDir.copy(raw).divideScalar(d);
    const lg = Math.log(d);
    // tốc độ ước lượng (đã làm mượt) để biết đang đứng yên hay đang di chuyển thật
    angVel += (wDir.angleTo(rDir) / dt - angVel) * lowpass(0.8, dt);
    logVel += (Math.abs(lg - wLogD) / dt - logVel) * lowpass(0.8, dt);
    // đứng yên: lọc rất êm — di chuyển: bám nhanh
    wDir.lerp(rDir, lowpass(0.5 + 40 * angVel, dt)).normalize();
    wLogD += (lg - wLogD) * lowpass(0.2 + 1.5 * Math.max(0, logVel - 0.15), dt);
    wPos.copy(wDir).multiplyScalar(Math.exp(wLogD));
  }
  let qVel = 0;
  function filterQuat(raw, dt) {
    qVel += (wQuat.angleTo(raw) / dt - qVel) * lowpass(0.8, dt);
    wQuat.slerp(raw, lowpass(0.4 + 2 * Math.max(0, qVel - 0.3), dt));
  }

  // đưa một tư thế trong khung camera (đo tại thời điểm tMeas) về hệ phòng
  function toWorld(pCam, qCam, tMeas, outP, outQ) {
    camQAt(tMeas - CAM_LAG, qM);
    outP.copy(pCam).applyQuaternion(qM);
    outQ.copy(qM).multiply(qCam);
  }

  function differs(pos, quat, s, refPos, refQuat, refS) {
    return { ang: refQuat.angleTo(quat), jump: pos.distanceTo(refPos) / refS, sRatio: Math.abs(s / refS - 1) };
  }

  function measure(m) {
    const t = nowS();
    m.decompose(mPos, mQuat, mScl);
    const sx = Math.abs(mScl.x), sy = Math.abs(mScl.y);
    const s = (sx + sy) / 2;
    const aniso = Math.max(sx, sy) / Math.max(1e-6, Math.min(sx, sy));
    if (aniso > 1.3) { if (have && ++rejects > 6) have = false; return; }
    toWorld(mPos, mQuat, t, mPos, mQuat);

    if (!have) {
      // cần 2 phép đo liên tiếp khớp nhau mới cho thỏ hiện (tránh hiện sai chỗ)
      if (cand) {
        const d = differs(mPos, mQuat, s, cPos, cQuat, cScale);
        if (d.ang < 0.3 && d.jump < 0.25 && d.sRatio < 0.2) {
          resetPos(mPos); wQuat.copy(mQuat); sScale = s;
          have = true; rejects = 0; cand = false; lastMeasT = t;
          return;
        }
      }
      cPos.copy(mPos); cQuat.copy(mQuat); cScale = s; cand = true;
      return;
    }
    const d = differs(mPos, mQuat, s, wPos, wQuat, sScale);
    if (d.ang > 0.5 || d.jump > 0.45 || d.sRatio > 0.3) {
      if (++rejects > 6) { have = false; cand = false; } // hỏng liên tục → ẩn rồi bắt lại từ đầu
      return;
    }
    rejects = 0;
    const dt = Math.min(0.2, Math.max(0.005, t - lastMeasT));
    lastMeasT = t;
    filterPos(mPos, dt);
    filterQuat(mQuat, dt);
    sScale += (s - sScale) * 0.05; // kích thước thật của hình vẽ không đổi → chỉ chỉnh rất chậm
  }

  // tính tư thế trong khung camera để vẽ (dùng hướng điện thoại tại thời điểm khung hình đang hiển thị)
  function updateRenderPose() {
    camQAt(nowS() - CAM_LAG, qR);
    qRi.copy(qR).invert();
    sPos.copy(wPos).applyQuaternion(qRi);
    sQuat.copy(qRi).multiply(wQuat);
  }

  // hướng đứng theo trọng lực
  const upW = new THREE.Vector3(0, 1, 0), upC = new THREE.Vector3(), nC = new THREE.Vector3();
  const xC = new THREE.Vector3(), yC = new THREE.Vector3(), basis = new THREE.Matrix4();
  const qInv = new THREE.Quaternion(), qOut = new THREE.Quaternion();
  function uprightQuat(q) {
    if (!gyro.ok) return q;
    upC.copy(upW).applyQuaternion(qInv.copy(gyro.q).invert());
    nC.set(0, 0, 1).applyQuaternion(q);
    if (nC.angleTo(upC) > 1.0) return q; // trang giấy dựng đứng (trên tường…) → dùng hướng camera đo
    xC.set(1, 0, 0).applyQuaternion(q);
    xC.addScaledVector(upC, -xC.dot(upC)).normalize();
    yC.crossVectors(upC, xC);
    basis.makeBasis(xC, yC, upC);
    return qOut.setFromRotationMatrix(basis);
  }

  // ----- bộ bám hình dự phòng: khi MindAR mất dấu (xa / nhòe) vẫn "ghim" thỏ vào hình vẽ -----
  const LT = window.LiteTracker;
  const container = document.getElementById("ar");
  const WW = 320; let WH = 0, gray = null;
  const wc = document.createElement("canvas");
  const wctx = wc.getContext("2d", { willReadFrequently: true });
  function grab() {
    const v = mindar.video;
    if (!v || !v.videoWidth) return false;
    const h = Math.round((WW * v.videoHeight) / v.videoWidth);
    if (h !== WH) { WH = h; wc.width = WW; wc.height = WH; gray = new Float32Array(WW * WH); }
    wctx.drawImage(v, 0, 0, WW, WH);
    const d = wctx.getImageData(0, 0, WW, WH).data;
    for (let i = 0, j = 0; i < gray.length; i++, j += 4) gray[i] = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
    return true;
  }
  const pv = new THREE.Vector3(), invP = new THREE.Matrix4(), wp = { x: 0, y: 0, z: 0 };
  function camToWork(p, out) {
    pv.copy(p).applyMatrix4(camera.projectionMatrix);
    const c = container.getBoundingClientRect(), vr = mindar.video.getBoundingClientRect();
    const sx = ((pv.x + 1) / 2) * c.width + c.left, sy = ((1 - pv.y) / 2) * c.height + c.top;
    out.x = ((sx - vr.left) / vr.width) * WW; out.y = ((sy - vr.top) / vr.height) * WH; out.z = pv.z;
    return out;
  }
  function workToRay(x, y, out) {
    const c = container.getBoundingClientRect(), vr = mindar.video.getBoundingClientRect();
    const sx = (x / WW) * vr.width + vr.left, sy = (y / WH) * vr.height + vr.top;
    const nx = ((sx - c.left) / c.width) * 2 - 1, ny = 1 - ((sy - c.top) / c.height) * 2;
    invP.copy(camera.projectionMatrix).invert();
    return out.set(nx, ny, 0.5).applyMatrix4(invP).normalize();
  }

  let tpl = null, capDist = 1, updCount = 0;
  const tC = new THREE.Vector3(), tK = new THREE.Vector3();
  function captureTemplate(m) {
    if (!grab()) return;
    tC.setFromMatrixPosition(m);
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const [cx, cy] of [[-0.5, -TARGET_H / 2], [0.5, -TARGET_H / 2], [0.5, TARGET_H / 2], [-0.5, TARGET_H / 2]]) {
      camToWork(tK.set(cx, cy, 0).applyMatrix4(m), wp);
      x0 = Math.min(x0, wp.x); x1 = Math.max(x1, wp.x); y0 = Math.min(y0, wp.y); y1 = Math.max(y1, wp.y);
    }
    camToWork(tC, wp);
    const hw = ((x1 - x0) / 2) * 0.85, hh = ((y1 - y0) / 2) * 0.85;
    if (hw < 6 || hh < 6) return;
    const t = LT.createTemplate(gray, WW, WH, wp.x, wp.y, hw, hh);
    if (t) { tpl = t; capDist = tC.length(); }
  }

  let liteActive = false, liteConf = 0, lowSince = 0, lostAt = -99;
  const ray = new THREE.Vector3(), tgt = new THREE.Vector3();
  function hideBunny(now) {
    have = false; cand = false; liteActive = false;
    lostAt = now;
    hint.hidden = false;
    hintText.textContent = "Đưa camera vào hình vẽ…";
  }
  const liteRaw = new THREE.Vector3(), liteQ = new THREE.Quaternion();
  let liteS = 1;
  function liteStep(now) {
    updateRenderPose();
    camToWork(sPos, wp);
    // hình vẽ ra khỏi khung hình → thỏ biến mất
    if (wp.z > 1 || wp.x < -8 || wp.x > WW + 8 || wp.y < -8 || wp.y > WH + 8) { hideBunny(now); return; }
    if (!grab()) return;
    const sPred = capDist / sPos.length();
    const r = LT.match(gray, WW, WH, tpl, wp.x, wp.y, sPred, 16);
    liteS += (r.s - liteS) * 0.25; // tỉ lệ đo theo bậc → làm mượt để thỏ không to nhỏ giật cục
    liteConf += (Math.max(0, r.conf) - liteConf) * 0.3;
    if (r.conf > 0.3) {
      lowSince = 0;
      workToRay(r.x, r.y, ray);
      tgt.copy(ray).multiplyScalar(capDist / liteS);
      const t = nowS();
      toWorld(tgt, sQuat, t, liteRaw, liteQ);
      const dt = Math.min(0.2, Math.max(0.005, t - lastMeasT));
      lastMeasT = t;
      filterPos(liteRaw, dt);
    } else {
      if (!lowSince) lowSince = now;
      if (now - lowSince > 0.8) hideBunny(now); // không tìm thấy hình vẽ nữa
    }
  }

  // độ mờ: bám chắc = rõ nét, đang bám dự phòng (xa / nhòe) = mờ dần theo độ tin cậy
  const mats = new Set();
  actor.root.children[1].traverse((o) => { if (o.material) mats.add(o.material); });
  let opacity = 1;
  function setOpacity(o) {
    opacity += (o - opacity) * 0.15;
    const tr = opacity < 0.99;
    for (const m of mats) {
      if (m.transparent !== tr) { m.transparent = tr; m.needsUpdate = true; }
      m.opacity = tr ? opacity : 1;
    }
  }

  anchor.onTargetFound = () => {
    const now = clock.getElapsedTime();
    hint.hidden = true;
    if (liteActive && have) { liteActive = false; rejects = 0; return; } // bám dự phòng → bám chính, không nháy
    have = false; cand = false;
    if (actor.state === "hidden" || now - lostAt > REJUMP_AFTER) actor.jump(now);
  };
  anchor.onTargetUpdate = () => {
    if (!anchor.group.visible) return;
    measure(anchor.group.matrix);
    if (have && rejects === 0 && ++updCount % 6 === 0) captureTemplate(anchor.group.matrix);
  };
  anchor.onTargetLost = () => {
    const now = clock.getElapsedTime();
    if (have && tpl) { liteActive = true; lowSince = 0; liteConf = 0.7; updateRenderPose(); liteS = capDist / sPos.length(); } // chuyển sang bám dự phòng
    else hideBunny(now);
  };
  renderer.domElement.addEventListener("pointerdown", () => actor.hop(clock.getElapsedTime()));

  await mindar.start();
  hint.hidden = false;
  renderer.setAnimationLoop(() => {
    const now = clock.getElapsedTime();
    if (liteActive && have) liteStep(now);
    if (have) updateRenderPose();
    const shown = have && (anchor.group.visible || liteActive);
    holder.visible = shown;
    if (shown) holder.matrix.compose(sPos, uprightQuat(sQuat), one.setScalar(sScale));
    holder.matrixWorldNeedsUpdate = true;
    setOpacity(liteActive ? 0.4 + 0.6 * Math.min(1, Math.max(0, (liteConf - 0.3) / 0.45)) : 1);
    actor.update(now);
    renderer.render(scene, camera);
  });
  window.__ar = { mindar, anchor, holder, actor, gyro, get lite() { return { liteActive, liteConf, tpl: !!tpl }; } };
}

// ---------- chế độ xem thử (không camera) ----------
async function startDemo() {
  const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
  document.body.style.background = '#efe3d3';
  const el = document.getElementById('ar');
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  el.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.01, 50);
  camera.up.set(0, 0, 1);
  camera.position.set(0.6, -2.2, 1.6);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0, 0.25);
  controls.update();
  addLights(scene);

  // trang giấy có hình vẽ
  const tex = new THREE.TextureLoader().load('target.jpg');
  tex.colorSpace = THREE.SRGBColorSpace;
  const page = new THREE.Mesh(new THREE.PlaneGeometry(1, TARGET_H), new THREE.MeshBasicMaterial({ map: tex }));
  scene.add(page);

  const actor = makeActor();
  scene.add(actor.root);
  const replay = () => actor.jump(clock.getElapsedTime());
  setTimeout(replay, 900);
  hint.hidden = false;
  hintText.textContent = 'Chạm để chú thỏ nhảy · chạm 2 lần để xem lại từ đầu';
  renderer.domElement.addEventListener('dblclick', replay);
  renderer.domElement.addEventListener('pointerdown', () => actor.hop(clock.getElapsedTime()));
  window.__demo = { actor, camera, controls, replay };

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  renderer.setAnimationLoop(() => {
    actor.update(clock.getElapsedTime());
    renderer.render(scene, camera);
  });
}

if (isDemo) {
  intro.remove();
  startDemo();
} else {
  document.getElementById('start').onclick = async () => {
    const gyroAsk = askGyroPermission(); // gọi ngay khi bấm (yêu cầu của iOS)
    const btn = document.getElementById('start');
    btn.disabled = true; btn.textContent = 'Đang mở camera…';
    try {
      if (await gyroAsk) listenGyro();
      await startAR();
      intro.remove();
    } catch (e) {
      console.error(e);
      btn.disabled = false; btn.textContent = '📷 Thử lại';
      document.getElementById('err').textContent =
        'Không mở được camera. Hãy cho phép trình duyệt dùng camera và mở trang bằng link https.';
    }
  };
}
